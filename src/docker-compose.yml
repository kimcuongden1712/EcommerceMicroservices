services:
  #database section
  orderdb:
    image: mcr.microsoft.com/mssql/server:2022-latest

  identitydb:
    image: mcr.microsoft.com/mssql/server:2022-latest

  productdb:
    image: mysql:8.0.45
    # platform: linux/amd64 #open this line if you use mac m1, m2

  customerdb:
    image: postgres:alpine3.16

  basketdb:
    image: redis:alpine

  inventorydb:
    image: mongo:7.0.43

  hangfiredb:
    image: mongo:7.0.43

#  #infrastructure section
  rabbitmq:
    image: rabbitmq:3-management-alpine

  pgadmin:
    image: dpage/pgadmin4

  portainer:
    image: portainer/portainer-ce

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.7

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.7

  #microservices api section
  product.api:
    image: ${DOCKER_REGISTRY-}product-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Product.API/Dockerfile

  customer.api:
    image: ${DOCKER_REGISTRY-}customer-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Customer.API/Dockerfile

  basket.api:
    image: ${DOCKER_REGISTRY-}basket-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Basket.API/Dockerfile

  ordering.api:
    image: ${DOCKER_REGISTRY-}ordering-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile

  inventory.product.api:
    image: ${DOCKER_REGISTRY-}inventory-product-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Inventory/Inventory.Product.API/Dockerfile

  inventory.grpc:
    image: ${DOCKER_REGISTRY-}inventory-grpc:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Inventory/Inventory.Grpc/Dockerfile

  apigw.ocelot:
    image: ${DOCKER_REGISTRY-}apigw-ocelot:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: ApiGateways/OcelotApiGw/Dockerfile

  hangfire.api:
    image: ${DOCKER_REGISTRY-}hangfire-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Services/Hangfire.API/Dockerfile

  saga.api:
    image: ${DOCKER_REGISTRY-}saga-api:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: Saga.Orchestrator/Saga.Orchestrator/Dockerfile

  identity.api:
    image: kietphamdev/tedu-microservice-idp:dotnet10
    pull_policy: always

  webstatus:
    image: ${DOCKER_REGISTRY-}webstatus:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: WebApps/WebHealthStatus/Dockerfile

#network section
networks:
  default:
    name: ecommerce_microservices

#volumes section
volumes:
  ecommerce_sqlserver_data:
    name: ecommerce_sqlserver_data
  ecommerce_identity_sqlserver_data:
    name: ecommerce_identity_sqlserver_data
  ecommerce_mysql_data:
    name: ecommerce_mysql_data
  ecommerce_postgres_data:
    name: ecommerce_postgres_data
  ecommerce_portainer_data:
    name: ecommerce_portainer_data
  ecommerce_elasticsearch_data:
    name: ecommerce_elasticsearch_data
  ecommerce_jaeger_data:
    name: ecommerce_jaeger_data
  ecommerce_mongo_data:
    name: ecommerce_mongo_data
  ecommerce_hangfire_mongo_data:
    name: ecommerce_hangfire_mongo_data
  ecommerce_pgadmin_data:
    name: ecommerce_pgadmin_data
  ecommerce_rabbitmq_data:
    name: ecommerce_rabbitmq_data