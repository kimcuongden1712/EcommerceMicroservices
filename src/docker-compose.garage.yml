services:
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: ecommerce_garage
    command: ["/garage", "server", "--single-node"]
    restart: unless-stopped
    env_file:
      - ./Infrastructure/Garage/.env.garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ./Infrastructure/Garage/garage.toml:/etc/garage.toml:ro
      - ecommerce_garage_meta:/var/lib/garage/meta
      - ecommerce_garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
    networks:
      garage:
        aliases:
          - garage

networks:
  garage:
    name: ecommerce_garage

volumes:
  ecommerce_garage_meta:
    name: ecommerce_garage_meta
  ecommerce_garage_data:
    name: ecommerce_garage_data
