services:
  #database section

  #orderdb: sql server
  orderdb:
    container_name: ecommerce_order_db
    environment:
      SA_PASSWORD: "Passw0rd!"
      ACCEPT_EULA: "Y"
    volumes:
      - ecommerce_sqlserver_data:/var/opt/mssql
    restart: always
    ports:
      - "1435:1433"

  identitydb:
    container_name: ecommerce_identity_db
    environment:
      SA_PASSWORD: "Passw0rd!"
      ACCEPT_EULA: "Y"
    volumes:
      - ecommerce_identity_sqlserver_data:/var/opt/mssql
    restart: always
    ports:
      - "1436:1433"

  #productdb: mysql
  productdb:
    container_name: ecommerce_product_db
    command: [ "--default-authentication-plugin=mysql_native_password" ]
    environment:
      MYSQL_ROOT_PASSWORD: "Passw0rd"
      MYSQL_DATABASE: ProductDb
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPassw0rd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ecommerce_mysql_data:/var/lib/mysql
    ports:
      - 3307:3306

  #customerdb: postgres
  customerdb:
    container_name: ecommerce_customer_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=CustomerDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

  #basketdb: redis
  basketdb:
    container_name: ecommerce_basket_db
    restart: always
    ports:
      - "6379:6379"

  #inventorydb: mongo
  inventorydb:
    container_name: ecommerce_inventory_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ecommerce_mongo_data:/data/db

  hangfiredb:
    container_name: ecommerce_hangfire_db
    ports:
      - '27018:27017'
    volumes:
      - ecommerce_hangfire_mongo_data:/data/db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'admin'
      MONGO_INITDB_ROOT_PASSWORD: 'admin'

#infrastructure section
  rabbitmq:
    container_name: ecommerce_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tedu
      RABBITMQ_DEFAULT_PASS: Passw0rd
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ecommerce_rabbitmq_data:/var/lib/rabbitmq
    hostname: ecommerce_rabbitmq

  pgadmin:
    container_name: ecommerce_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@tedu.com.vn
      - PGADMIN_DEFAULT_PASSWORD=admin1234
    restart: always
    ports:
      - "5050:80"
    volumes:
      - ecommerce_pgadmin_data:/root/.pgadmin

  portainer:
    container_name: ecommerce_portainer
    restart: always
    ports:
      - "8082:8000"
      - "9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ecommerce_portainer_data:/data

  elasticsearch:
    container_name: ecommerce_elasticsearch
    environment:
      - xpack.monitoring.enabled=true
      - xpack.watcher.enabled=false
      - xpack.security.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      #      - ELASTIC_USERNAME=elastic #default username
      - ELASTIC_PASSWORD=admin
    ports:
      - "9200:9200"
    volumes:
      - ecommerce_elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    container_name: ecommerce_kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=admin
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null; if [[ $$? == 52 ]]; then echo 0; else echo 1; fi
      interval: 30s
      timeout: 10s
      retries: 5

  garage:
    container_name: ecommerce_garage
    env_file:
      - ./Infrastructure/Garage/.env.garage
    volumes:
      - ./Infrastructure/Garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:3900:3900"

  #microservices api sections
  product.api:
    container_name: product.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=Server=ecommerce_product_db;Database=ProductDb;Uid=root;Pwd=Passw0rd"
      - "ApiConfiguration:ApiBaseUrl=http://product.api"
      - "ApiConfiguration:IdentityServerBaseUrl=http://localhost:6001"
      - "ApiConfiguration:IssuerUri=http://ecommerce.identity.api"
      - "ObjectStorage__S3__ServiceUrl=${GARAGE_S3_ENDPOINT:?Load the provisioned Product API S3 environment file}"
      - "ObjectStorage__S3__PresignedServiceUrl=${GARAGE_S3_PUBLIC_ENDPOINT:-http://localhost:3900}"
      - "ObjectStorage__S3__Region=${GARAGE_S3_REGION:?Load the provisioned Product API S3 environment file}"
      - "ObjectStorage__S3__ForcePathStyle=true"
      - "ObjectStorage__S3__AccessKey=${GARAGE_S3_ACCESS_KEY_ID:?Load the provisioned Garage Product API key}"
      - "ObjectStorage__S3__SecretKey=${GARAGE_S3_SECRET_ACCESS_KEY:?Load the provisioned Garage Product API secret}"
    depends_on:
      productdb:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "6002:80"
    restart: always

  customer.api:
    container_name: customer.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=Server=ecommerce_customer_db;Database=CustomerDb;User Id=admin;Password=admin1234"
      - "HangFireSettings:Storage:ConnectionString=Server=ecommerce_customer_db;Port=5432;Database=CustomerDb;User Id=admin;Password=admin1234"
    depends_on:
      - customerdb
    ports:
      - "6003:80"
    restart: always

  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "CacheSettings:ConnectionString=basketdb:6379"
      - "EventBusSettings:HostAddress=amqp://tedu:Passw0rd@rabbitmq:5672"
      - "EventBusSettings:ServiceName=Basket"
      - "GrpcSettings:StockUrl=http://inventory.grpc"
      - BackgroundJobSettings:HangfireUrl=http://hangfire.api
      - BackgroundJobSettings:CheckoutUrl=http://localhost:6001
    depends_on:
      - basketdb
      - rabbitmq
    ports:
      - "6004:80"
    restart: always

  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "DatabaseSettings:ConnectionString=Server=ecommerce_order_db;Database=OrderDb;User Id=sa;Password=Passw0rd!;Multipleactiveresultsets=true;TrustServerCertificate=true;Connection Timeout=30;"
      - "EventBusSettings:HostAddress=amqp://tedu:Passw0rd@rabbitmq:5672"
      - "EventBusSettings:ServiceName=Ordering"
    depends_on:
      - orderdb
      - rabbitmq
    ports:
      - "6005:80"
    restart: always

  inventory.product.api:
    container_name: inventory.product.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "MongoDbSettings:ConnectionString=mongodb://inventorydb"
      - "MongoDbSettings:DatabaseName=InventoryDb"
    depends_on:
      - inventorydb
    ports:
      - "6006:80"
    restart: always

  inventory.grpc:
    container_name: inventory.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+:80
      - "MongoDbSettings:ConnectionString=mongodb://inventorydb"
      - "MongoDbSettings:DatabaseName=InventoryDb"
    depends_on:
      - inventorydb
    ports:
      - "6007:80"
    restart: always

  apigw.ocelot:
    container_name: apigw.ocelot
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+:80
      - GlobalConfiguration:BaseUrl=http://apigw.ocelot
      - ApiConfiguration:ApiBaseUrl=http://apigw.ocelot
      - ApiConfiguration:IdentityServerBaseUrl=http://localhost:6001
      - ApiConfiguration:IssuerUri=http://ecommerce.identity.api
    depends_on:
      - customer.api
      - basket.api
      - product.api
      - ordering.api
      - inventory.product.api
      - identity.api
    ports:
      - "6020:80"
    restart: always

  hangfire.api:
    container_name: hangfire.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "HangFireSettings:Storage:ConnectionString=mongodb://admin:admin@hangfiredb/hangfire-webapi?authSource=admin"
    depends_on:
      - hangfiredb
    ports:
      - "6008:80"
    restart: always

  saga.api:
    container_name: saga.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "EventBusSettings:HostAddress=amqp://tedu:Passw0rd@rabbitmq:5672"
      - "EventBusSettings:ServiceName=Saga"
      - "ServiceUrls:Basket=http://basket.api"
      - "ServiceUrls:Orders=http://ordering.api"
      - "ServiceUrls:Inventory=http://inventory.product.api"
    ports:
      - "6009:80"
    restart: always

  identity.api:
    container_name: identity.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings:IdentitySqlConnection=Server=identitydb;Database=EcommerceIdentity;User Id=sa;Password=Passw0rd!;Multipleactiveresultsets=true;TrustServerCertificate=true;Connection Timeout=30;"
      - "IdentityServer:BaseUrl=http://localhost:6001"
      - "IdentityServer:IssuerUri=http://ecommerce.identity.api"
      - "ElasticConfiguration:Uri=http://elasticsearch:9200"
    depends_on:
      - identitydb
    ports:
      - "6001:80"
    restart: always

  webstatus:
    container_name: webstatus
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - HealthChecksUI__HealthChecks__0__Name=Product Health Check
      - HealthChecksUI__HealthChecks__0__Uri=http://product.api/hc
      - HealthChecksUI__HealthChecks__1__Name=Customer Health Check
      - HealthChecksUI__HealthChecks__1__Uri=http://customer.api/hc
      - HealthChecksUI__HealthChecks__2__Name=Basket Health Check
      - HealthChecksUI__HealthChecks__2__Uri=http://basket.api/hc
      - HealthChecksUI__HealthChecks__3__Name=Ordering Health Check
      - HealthChecksUI__HealthChecks__3__Uri=http://ordering.api/hc
      - HealthChecksUI__HealthChecks__4__Name=Inventory Health Check
      - HealthChecksUI__HealthChecks__4__Uri=http://inventory.product.api/hc
      - HealthChecksUI__HealthChecks__5__Name=Scheduled Job Health Check
      - HealthChecksUI__HealthChecks__5__Uri=http://hangfire.api/hc
      - HealthChecksUI__HealthChecks__6__Name=Identity Health Check
      - HealthChecksUI__HealthChecks__6__Uri=http://ecommerce.identity.api/hc
    ports:
      - "6010:80"
